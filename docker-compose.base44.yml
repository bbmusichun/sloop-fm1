# Base44 sandbox run for Snoop37 / SLOOP.
#
# The repository is a firmware port (C, JieLi AC791N toolchain) plus a static web
# app. The web app is what runs here: docs/ is the project's own GitHub Pages root
# (installer, editor, firmware package), served as-is with no build step, so edits
# under docs/ are visible on the next reload.
#
# The firmware itself is not built here: it needs the JieLi toolchain and the AC79
# SDK (see BUILDING.md), which are not part of the repository.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", ".base44/serve_site.py"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      base44.project: "SLOOP web app"
      base44.kind: "web"
      base44.port: "3000"
